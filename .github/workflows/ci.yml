name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      DATABASE_URL: postgres://shop:shop@localhost:5433/shop
      DATABASE_URL_TEST: postgres://shop:shop@localhost:5433/shop_test
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      ORDER_EXPIRE_MINUTES: '15'
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=shop psql -h localhost -p 5433 -U shop -d shop -c 'CREATE DATABASE shop_test;'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - name: Unit / integration tests (with coverage thresholds)
        run: pnpm test:unit
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: E2E (Playwright)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
